[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "heavy-machinery-autonomy"
version = "0.0.1"
description = "A simulation demo: an excavator carries out a plain-English task on rough ground without tipping, with one controller for every randomised machine"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0 AND Apache-2.0"
license-files = ["LICENSE.md", "src/hma/machine/assets/LICENSE", "src/hma/machine/assets/NOTICE"]
dependencies = [
    "mujoco>=4.0",
    "numba>=0.68",
    "numpy>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
train = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["train_extra: needs the training extra (gymnasium and Stable-Baselines3)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
