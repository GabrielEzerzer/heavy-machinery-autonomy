# CI for this repo.
# It runs on pushes to branches other than the default and on manual dispatch, so each push starts one run
# and a branch has results before its PR exists.
# Never give this workflow production URLs, real secrets, .env.local or a service_role key.
name: ci

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Suite
        run: pytest -q
